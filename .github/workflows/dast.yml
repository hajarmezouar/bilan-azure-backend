name: Security - DAST

on:
  workflow_dispatch:

  workflow_run:
    workflows:
      - "Backend CI/CD"
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

jobs:
  zap:
    name: OWASP ZAP baseline scan

    # Automatic DAST runs only after Backend CI/CD succeeds.
    # Manual workflow_dispatch runs are also allowed.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest
    environment: nonprod

    steps:
      - name: Check target availability
        env:
          TARGET_URL: ${{ vars.BACKEND_URL }}
        run: |
          echo "Checking non-production backend availability..."
          curl --fail \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 10 \
            "${TARGET_URL}/actuator/health"

      - name: Run OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@7c8b4c74092c4b57d6333ecbd7a3a6d0509b0e3e # v0.15.0
        with:
          target: ${{ vars.BACKEND_URL }}
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-backend-report